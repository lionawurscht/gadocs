<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src blob:; base-uri 'none'; form-action 'none'">
<title>Goral Assistance – Medical Release</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="top">
  <img class="logo" src="logo.png" alt="Goral Assistance">
  <div class="langbar">
    <div class="langs" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="langs aids" role="group" aria-label="Hilfe / Help (es, pt, pl)">
      <button type="button" data-aid="es" title="Traducción como ayuda">ES · ayuda</button>
      <button type="button" data-aid="pt" title="Tradução como ajuda">PT · ajuda</button>
      <button type="button" data-aid="pl" title="Tłumaczenie jako pomoc">PL · pomoc</button>
    </div>
  </div>
</header>

<main id="app" hidden>
  <p class="aidnotice" id="aid-notice" hidden></p>
  <div class="v1only">
  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="grid">
    <div class="fact"><div class="lab" data-t="to"></div><div class="val" id="f-recipient"></div></div>
    <div class="fact"><div class="lab" data-t="patient"></div><div class="val" id="f-name"></div></div>
    <div class="fact"><div class="lab" data-t="dob"></div><div class="val" id="f-dob"></div></div>
    <div class="fact"><div class="lab" data-t="caseNo"></div><div class="val" id="f-case"></div></div>
  </div>

  <section>
    <h2 data-t="s1"></h2>
    <p id="s1-text" data-aid-key="s1Text"></p>
  </section>

  <section>
    <h2 data-t="s2"></h2>
    <p data-t="s2Text"></p>
    <p class="hint" data-t="tick"></p>
    <div class="q open" id="q-record" role="group" aria-labelledby="q-record-t">
      <div class="qtitle"><span class="badge" data-t="answerNeeded"></span><span id="q-record-t" data-t="record"></span></div>
      <p class="qnote" data-t="needYes"></p>
      <div class="opts">
        <label><input type="radio" name="record" value="yes"><span data-t="yes"></span></label>
        <label><input type="radio" name="record" value="no"><span data-t="no"></span></label>
      </div>
    </div>
    <div class="q open" id="q-form" role="group" aria-labelledby="q-form-t">
      <div class="qtitle"><span class="badge" data-t="answerNeeded"></span><span id="q-form-t" data-t="form"></span></div>
      <div class="opts stack">
        <label><input type="radio" name="form" value="electronic"><span data-t="electronic"></span></label>
        <label><input type="radio" name="form" value="hardcopy"><span data-t="hardCopy"></span></label>
        <label><input type="radio" name="form" value="both"><span data-t="formBoth"></span></label>
      </div>
    </div>
  </section>

  <section>
    <h2 data-t="s3"></h2>
    <p data-t="s3Text"></p>
    <dl class="facts company">
      <dt data-t="s3Name"></dt><dd id="co-name"></dd>
      <dt data-t="s3Org"></dt><dd id="co-org"></dd>
      <dt data-t="s3Address"></dt><dd id="co-address"></dd>
    </dl>
    <p data-t="s3Note"></p>
  </section>

  <section>
    <h2 data-t="s4"></h2>
    <p data-t="s4Text"></p>
  </section>

  </div>

  <div class="v2only">
    <h1 data-t="title"></h1>
    <p class="intro" data-t="intro"></p>

    <div class="grid">
      <div class="fact"><div class="lab" data-t="caseNo"></div><div class="val" id="g-case"></div></div>
      <div class="fact"><div class="lab" data-t="treatDate"></div><div class="val" id="g-treat"></div></div>
      <div class="fact"><div class="lab" data-t="provider"></div><div class="val" id="g-recipient"></div></div>
      <div class="fact"><div class="lab" data-t="patientFull"></div><div class="val" id="g-name"></div></div>
      <div class="fact"><div class="lab" data-t="dob"></div><div class="val" id="g-dob"></div></div>
    </div>
    <label class="field"><span data-t="location"></span>
      <input type="text" id="g-loc" data-ph="locationPh"></label>

    <section>
      <h2 data-t="s1"></h2>
      <p data-t="s1Text"></p>
      <ul id="s1-items"></ul>
      <p data-t="s1After"></p>
    </section>
    <section>
      <h2 data-t="s2"></h2>
      <p data-t="s2Text"></p>
    </section>
    <section>
      <h2 data-t="s3"></h2>
      <p data-t="s3Text"></p>
    </section>
    <section>
      <h2 data-t="s4"></h2>
      <p data-t="s4Email"></p>
      <label class="check"><input type="checkbox" id="c-tele"><span data-t="telehealth"></span></label>
    </section>
    <section>
      <h2 data-t="s5"></h2>
      <ul id="s5-items"></ul>
    </section>
    <section>
      <h2 data-t="s6"></h2>
      <p data-t="s6Text"></p>
      <label class="check"><input type="checkbox" id="c-digital"><span data-t="digital"></span></label>
    </section>
  </div>

  <section class="signing">
    <label class="check strong"><input type="checkbox" id="c-rep"><span data-t="onBehalf"></span></label>
    <div id="rep" hidden>
      <p class="hint" data-t="repIntro"></p>
      <label class="field"><span data-t="repName"></span>
        <input type="text" id="rep-name" autocomplete="name" data-ph="repNamePh"></label>
      <label class="field" id="rep-kind-field"><span data-t="authorityPick"></span>
        <select id="rep-kind">
          <option value="parent" data-t="authorities.parent"></option>
          <option value="guardian" data-t="authorities.guardian"></option>
          <option value="proxy" data-t="authorities.proxy"></option>
          <option value="other" data-t="authorities.other"></option>
        </select></label>
      <label class="field" id="rep-detail-field"><span data-t="repAuthority"></span>
        <textarea id="rep-detail" rows="2" data-ph="authorityPh"></textarea></label>
    </div>

    <div class="sigrow">
      <div class="sigbox" id="sig-box">
        <img id="sig-img" alt="" hidden>
        <span id="sig-empty" data-t="signHere"></span>
      </div>
      <div class="sigmeta">
        <span id="sig-label"></span>
        <span><span data-t="date"></span>: <span id="sig-date"></span></span>
      </div>
    </div>
    <button type="button" class="btn" id="b-sign" data-t="sign"></button>
  </section>

  <p class="error" id="msg" role="alert" hidden></p>

  <p class="openline" id="open-line" role="status"></p>
  <div class="actions">
    <button type="button" class="btn primary" id="b-pdf" data-t="makePdf"></button>
  </div>
  <div class="actions" id="done" hidden>
    <button type="button" class="btn primary" id="b-share" data-t="share" hidden></button>
    <a class="btn" id="b-download" data-t="download"></a>
    <a class="btn" id="b-view" target="_blank" rel="noopener" data-t="view"></a>
    <p class="hint" data-t="sendBack"></p>
  </div>

  <p class="small" data-t="confidentiality"></p>
</main>

<main id="fail" hidden>
  <p class="error" id="fail-msg"></p>
</main>

<div class="pad" id="pad" hidden>
  <div class="padbar">
    <button type="button" class="btn" id="p-cancel" data-t="cancel"></button>
    <button type="button" class="btn" id="p-clear" data-t="clear"></button>
    <button type="button" class="btn primary" id="p-ok" data-t="confirm"></button>
  </div>
  <div class="padarea">
    <canvas id="pad-canvas"></canvas>
    <div class="padline"><span data-t="signHere"></span></div>
    <p class="padhint" data-t="rotateHint"></p>
  </div>
</div>

<script src="texts.js?v=5"></script>
<script src="aid.js?v=5"></script>
<script src="codec.js?v=5"></script>
<script src="signature.js?v=5"></script>
<script src="pdf.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
