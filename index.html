<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src blob:; base-uri 'none'; form-action 'none'">
<title>Goral Assistance – Medical Release</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img class="logo" src="logo.png" alt="Goral Assistance">
  <div class="langs" role="group" aria-label="Sprache / Language">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main id="app" hidden>
  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>

  <dl class="facts">
    <dt data-t="to"></dt><dd id="f-recipient"></dd>
    <dt data-t="patient"></dt><dd id="f-name"></dd>
    <dt data-t="dob"></dt><dd id="f-dob"></dd>
    <dt data-t="caseNo"></dt><dd id="f-case"></dd>
  </dl>

  <section>
    <h2 data-t="s1"></h2>
    <p id="s1-text"></p>
  </section>

  <section>
    <h2 data-t="s2"></h2>
    <p data-t="s2Text"></p>
    <p class="hint" data-t="tick"></p>
    <label class="check"><input type="checkbox" id="c-record" checked><span data-t="record"></span></label>
    <p class="sub" data-t="form"></p>
    <label class="check"><input type="checkbox" id="c-electronic" checked><span data-t="electronic"></span></label>
    <label class="check"><input type="checkbox" id="c-hardcopy"><span data-t="hardCopy"></span></label>
  </section>

  <section>
    <h2 data-t="s3"></h2>
    <p data-t="s3Text"></p>
    <dl class="facts company">
      <dt data-t="s3Name"></dt><dd id="co-name"></dd>
      <dt data-t="s3Org"></dt><dd id="co-org"></dd>
      <dt data-t="s3Address"></dt><dd id="co-address"></dd>
    </dl>
    <p data-t="s3Note"></p>
  </section>

  <section>
    <h2 data-t="s4"></h2>
    <p data-t="s4Text"></p>
  </section>

  <section class="signing">
    <label class="check strong"><input type="checkbox" id="c-rep"><span data-t="onBehalf"></span></label>
    <div id="rep" hidden>
      <p class="hint" data-t="repIntro"></p>
      <label class="field"><span data-t="repName"></span>
        <input type="text" id="rep-name" autocomplete="name" data-ph="repNamePh"></label>
      <label class="field"><span data-t="authorityPick"></span>
        <select id="rep-kind">
          <option value="parent" data-t="authorities.parent"></option>
          <option value="guardian" data-t="authorities.guardian"></option>
          <option value="proxy" data-t="authorities.proxy"></option>
          <option value="other" data-t="authorities.other"></option>
        </select></label>
      <label class="field"><span data-t="repAuthority"></span>
        <textarea id="rep-detail" rows="2" data-ph="authorityPh"></textarea></label>
    </div>

    <div class="sigrow">
      <div class="sigbox" id="sig-box">
        <img id="sig-img" alt="" hidden>
        <span id="sig-empty" data-t="signHere"></span>
      </div>
      <div class="sigmeta">
        <span id="sig-label"></span>
        <span><span data-t="date"></span>: <span id="sig-date"></span></span>
      </div>
    </div>
    <button type="button" class="btn" id="b-sign" data-t="sign"></button>
  </section>

  <p class="error" id="msg" role="alert" hidden></p>

  <div class="actions">
    <button type="button" class="btn primary" id="b-pdf" data-t="makePdf"></button>
  </div>
  <div class="actions" id="done" hidden>
    <button type="button" class="btn primary" id="b-share" data-t="share" hidden></button>
    <a class="btn" id="b-download" data-t="download"></a>
    <a class="btn" id="b-view" target="_blank" rel="noopener" data-t="view"></a>
    <p class="hint" data-t="sendBack"></p>
  </div>

  <p class="small" data-t="confidentiality"></p>
</main>

<main id="fail" hidden>
  <p class="error" id="fail-msg"></p>
</main>

<div class="pad" id="pad" hidden>
  <div class="padbar">
    <button type="button" class="btn" id="p-cancel" data-t="cancel"></button>
    <button type="button" class="btn" id="p-clear" data-t="clear"></button>
    <button type="button" class="btn primary" id="p-ok" data-t="confirm"></button>
  </div>
  <div class="padarea">
    <canvas id="pad-canvas"></canvas>
    <div class="padline"><span data-t="signHere"></span></div>
    <p class="padhint" data-t="rotateHint"></p>
  </div>
</div>

<script src="texts.js"></script>
<script src="codec.js"></script>
<script src="signature.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
